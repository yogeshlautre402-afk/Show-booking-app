@media (prefers-color-scheme:dark){:root{--bg:#190c15;--card:#26121f;--ink:#f6eef2;--mute:#bba5b3;--line:#44283a;--head:#2a0922;--red:#ff8a80;--green:#5ccf9a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Noto Sans Devanagari",Roboto,sans-serif;padding-bottom:90px}
header{background:var(--head);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px 14px;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:20px}header small{opacity:.75}
.wrap{padding:14px;max-width:640px;margin:auto}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
label{display:block;font-size:14px;color:var(--mute);margin:12px 0 4px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.item{display:flex;justify-content:space-between;gap:10px;cursor:pointer}
.item b{font-size:17px}.muted{color:var(--mute);font-size:14px}
.bal{font-weight:700;text-align:right}.due{color:var(--red)}.paid{color:var(--green)}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:10px;font:inherit;font-weight:700;cursor:pointer;margin-top:10px;background:var(--head);color:#fff}
.btn.gold{background:var(--gold);color:#1f1300}.btn.wa{background:#1f9d55}.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.del{background:transparent;color:var(--red);border:1px solid var(--red)}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);background:var(--gold);color:#1f1300;border:0;border-radius:28px;padding:16px 22px;font:inherit;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer}
.sum{display:flex;gap:8px;margin-bottom:6px}.sum div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.sum b{display:block;font-size:18px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}
.kv span:first-child{color:var(--mute)}.kv span:last-child{text-align:right;font-weight:600}
.back{background:none;border:0;color:#fff;font:inherit;font-size:15px;padding:0 0 6px;cursor:pointer}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;z-index:9}
.sug{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:4px;background:var(--card)}.sug:empty{display:none}.si{display:block;width:100%;text-align:left;padding:12px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;cursor:pointer}
</style>

function wrapTxt(x,t,mw){var w=String(t).split(" "),out=[],l="";w.forEach(function(k){var n=l?l+" "+k:k;if(x.measureText(n).width>mw&&l){out.push(l);l=k}else l=n});if(l)out.push(l);return out}
function receipt(b){
  var bl=balOf(b),F='system-ui,"Noto Sans Devanagari",Roboto,sans-serif';
  function go(im){
    var W=900,P=44,H=2800,c=document.createElement("canvas");c.width=W;c.height=H;var x=c.getContext("2d");
    x.fillStyle="#fff";x.fillRect(0,0,W,H);var y=0;
    if(im){var h=Math.round(im.height*W/im.width);x.drawImage(im,0,0,W,h);y=h}
    y+=56;x.textAlign="center";x.fillStyle="#3b0d2e";x.font="700 40px "+F;x.fillText(cfg.group,W/2,y);
    y+=46;x.fillStyle="#6e5b68";x.font="600 28px "+F;x.fillText("बुकिंग पावती",W/2,y);
    y+=26;x.textAlign="left";
    var rows=[["बुकिंग क्र.",b.id],["ग्राहक",b.name],["मोबाईल",b.mobile],["कार्यक्रम",b.event+" · "+b.dance],["शो तारीख",fdate(b.date)+(b.time?"  "+ftime(b.time):"")],["ठिकाण",place(b,1)],["कलाकार",artTxt(b,1)],["एकूण फी",rs(b.total)],["भरलेली रक्कम",rs(paidOf(b))],["बाकी रक्कम",bl?rs(bl):"पूर्ण भरले",bl?"#b3261e":"#1f7a4d"]].filter(function(r){return r[1]&&r[1]!=="-"});
    rows.forEach(function(r){
      x.font="600 28px "+F;var ls=wrapTxt(x,r[1],W-2*P-280);
      y+=44;x.fillStyle="#6e5b68";x.font="400 26px "+F;x.fillText(r[0],P,y);
      x.fillStyle=r[2]||"#241420";x.font="600 28px "+F;
      ls.forEach(function(t,i){if(i)y+=38;x.fillText(t,P+280,y)});
      y+=16;x.strokeStyle="#e8dde2";x.lineWidth=2;x.beginPath();x.moveTo(P,y);x.lineTo(W-P,y);x.stroke();
    });
    y+=60;x.textAlign="center";x.fillStyle="#3b0d2e";x.font="700 32px "+F;x.fillText("धन्यवाद!",W/2,y);
    if(cfg.phone){y+=44;x.fillStyle="#6e5b68";x.font="400 26px "+F;x.fillText("फोन: "+cfg.phone,W/2,y)}
    y+=50;
    var c2=document.createElement("canvas");c2.width=W;c2.height=y;c2.getContext("2d").drawImage(c,0,0);

      }catch(e){}

    },"image/png");
  }
  if(banner){var im=new Image();im.onload=function(){go(im)};im.onerror=function(){go(null)};im.src=banner}else go(null);
}

function h53(s){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0,c;i<s.length;i++){c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}

  if(!CLOUD){save(SESS,0);return localStart()}
  if(!confirm("Logout kelyavar ya phone varcha data kadhla jail. Cloud madhe surakshit rahto. Logout karaycha?"))return;
  var late=false,to=setTimeout(function(){late=true;toast("Internet chalu kara, mag logout kara")},7000);
  clearTimeout(pt);
  dref("data").set({json:JSON.stringify(data),cfg:JSON.stringify(cfg),t:Date.now()}).then(function(){
    if(late)return;clearTimeout(to);
    [KEY,SKEY,BKEY].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});
    data={n:0,list:[]};cfg={group:"Dance Group",phone:""};banner="";auth.signOut();
  },function(){clearTimeout(to);toast("Sync zale nahi. Internet tapasa")});
}
function start(){if(CLOUD)return cloudStart();localStart()}
start();
function sharePavati(canvas, text) {
  const dataUrl = canvas.toDataURL('image/png');
  if (window.AndroidShare && AndroidShare.shareImage) {
    AndroidShare.shareImage(dataUrl, text);
  } else if (navigator.share) {
    canvas.toBlob(b => {
      const f = new File([b], 'pavati.png', { type: 'image/png' });
      navigator.share({ files: [f], text: text });
    });
  }
}
