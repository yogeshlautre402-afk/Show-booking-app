name: Build Dance Show APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'index (1).html'
      - '.github/workflows/build-dance-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      -- name: Accept Android licenses
  run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true


      - name: Install Android SDK parts
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create Android project around index.html
        run: |
          mkdir -p androidproj/app/src/main/java/com/example/showbooking
          mkdir -p androidproj/app/src/main/assets
          mkdir -p androidproj/app/src/main/res/xml
          if [ -f "index (1).html" ]; then
            cp "index (1).html" androidproj/app/src/main/assets/index.html
          else
            cp index.html androidproj/app/src/main/assets/index.html
          fi
          cd androidproj

          cat > settings.gradle <<'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "ShowBooking"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          EOF

          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2g\n' > gradle.properties

          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.example.showbooking'
            compileSdk 34
            defaultConfig {
              applicationId 'com.example.showbooking'
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.webkit:webkit:1.11.0'
            implementation 'androidx.core:core:1.13.1'
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:label="Show Booking"
                android:allowBackup="true"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity
                  android:name=".MainActivity"
                  android:exported="true"
                  android:windowSoftInputMode="adjustResize"
                  android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
              <provider
                  android:name="androidx.core.content.FileProvider"
                  android:authorities="com.example.showbooking.fileprovider"
                  android:exported="false"
                  android:grantUriPermissions="true">
                <meta-data
                    android:name="android.support.FILE_PROVIDER_PATHS"
                    android:resource="@xml/file_paths" />
              </provider>
            </application>
          </manifest>
          EOF

          cat > app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths>
            <cache-path name="shared" path="shared/" />
          </paths>
          EOF

          cat > app/src/main/java/com/example/showbooking/MainActivity.java <<'EOF'
          package com.example.showbooking;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.util.Base64;
          import android.webkit.JavascriptInterface;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.core.content.FileProvider;
          import androidx.webkit.WebViewAssetLoader;
          import java.io.File;
          import java.io.FileOutputStream;

          public class MainActivity extends Activity {
            private WebView webView;
            private ValueCallback<Uri[]> fileCb;
            private static final int REQ_FILE = 1;

            public class Bridge {
              @JavascriptInterface
              public void shareImage(final String dataUrl, final String text) {
                runOnUiThread(new Runnable() {
                  public void run() { doShare(dataUrl, text); }
                });
              }
            }

            private void doShare(String dataUrl, String text) {
              try {
                String b64 = dataUrl.substring(dataUrl.indexOf(',') + 1);
                byte[] bytes = Base64.decode(b64, Base64.DEFAULT);
                File dir = new File(getCacheDir(), "shared");
                dir.mkdirs();
                File f = new File(dir, "pavati.png");
                FileOutputStream o = new FileOutputStream(f);
                o.write(bytes);
                o.close();
                Uri uri = FileProvider.getUriForFile(this, getPackageName() + ".fileprovider", f);
                Intent i = new Intent(Intent.ACTION_SEND);
                i.setType("image/png");
                i.putExtra(Intent.EXTRA_STREAM, uri);
                i.putExtra(Intent.EXTRA_TEXT, text);
                i.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                startActivity(Intent.createChooser(i, "Pavati pathva"));
              } catch (Exception e) { }
            }

            @Override
            protected void onCreate(Bundle b) {
              super.onCreate(b);
              webView = new WebView(this);
              setContentView(webView);
              WebSettings s = webView.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setDatabaseEnabled(true);
              final WebViewAssetLoader loader = new WebViewAssetLoader.Builder()
                  .addPathHandler("/assets/", new WebViewAssetLoader.AssetsPathHandler(this))
                  .build();
              webView.addJavascriptInterface(new Bridge(), "AndroidShare");
              webView.setWebViewClient(new WebViewClient() {
                @Override
                public WebResourceResponse shouldInterceptRequest(WebView v, WebResourceRequest r) {
                  return loader.shouldInterceptRequest(r.getUrl());
                }
                @Override
                public boolean shouldOverrideUrlLoading(WebView v, WebResourceRequest r) {
                  Uri u = r.getUrl();
                  if ("appassets.androidplatform.net".equals(u.getHost())) return false;
                  try { startActivity(new Intent(Intent.ACTION_VIEW, u)); } catch (Exception e) { }
                  return true;
                }
              });
              webView.setWebChromeClient(new WebChromeClient() {
                @Override
                public boolean onShowFileChooser(WebView w, ValueCallback<Uri[]> cb, FileChooserParams p) {
                  if (fileCb != null) fileCb.onReceiveValue(null);
                  fileCb = cb;
                  try {
                    startActivityForResult(p.createIntent(), REQ_FILE);
                  } catch (Exception e) {
                    fileCb = null;
                    return false;
                  }
                  return true;
                }
              });
              webView.loadUrl("https://appassets.androidplatform.net/assets/index.html");
            }

            @Override
            protected void onActivityResult(int req, int res, Intent data) {
              if (req == REQ_FILE && fileCb != null) {
                fileCb.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(res, data));
                fileCb = null;
              }
              super.onActivityResult(req, res, data);
            }

            @Override
            public void onBackPressed() {
              if (webView.canGoBack()) webView.goBack(); else super.onBackPressed();
            }
          }
          EOF

      - name: Build debug APK
        working-directory: androidproj
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ShowBooking-debug-APK
          path: androidproj/app/build/outputs/apk/debug/app-debug.apk
